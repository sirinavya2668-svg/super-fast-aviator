services:
  - type: web
    name: super-fast-aviator
    runtime: node
    plan: free

    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "24"

      - key: NODE_ENV
        value: production

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      # Copy the database's Internal Database URL here in Render Environment.
      - key: DATABASE_URL
        sync: false
