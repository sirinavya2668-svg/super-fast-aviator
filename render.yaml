services:
  - type: web
    name: super-fast-aviator
    runtime: node
    plan: starter

    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "24"

      - key: NODE_ENV
        value: production

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATA_DIR
        value: /var/data

    disk:
      name: aviator-data
      mountPath: /var/data
      sizeGB: 1
